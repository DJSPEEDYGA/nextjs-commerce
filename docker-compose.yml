version: '3.8'

services:
  goat-royalties:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: super-goat-royalties
    restart: unless-stopped
    ports:
      - "3000时长80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GOOGLE_AI_STUDIO_KEY=${GOOGLE_AI_STUDIO_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./public:/app/public:ro
      - goat-data:/app/data
    networks:
      - goat-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: goat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - goat-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: goat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - goat-network
    depends_on:
      - goat-royalties
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  goat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  goat-data:
    driver: local
  redis-data:
    driver: local