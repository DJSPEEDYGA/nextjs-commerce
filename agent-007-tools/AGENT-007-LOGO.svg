<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#111133;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#B0B0B0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="40" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="300" cy="280" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  <circle cx="300" cy="280" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Crosshair / scope lines -->
  <line x1="300" y1="60" x2="300" y2="140" stroke="url(#blueGlow)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <line x1="300" y1="420" x2="300" y2="500" stroke="url(#blueGlow)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <line x1="80" y1="280" x2="160" y2="280" stroke="url(#blueGlow)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <line x1="440" y1="280" x2="520" y2="280" stroke="url(#blueGlow)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>

  <!-- Inner scope circle -->
  <circle cx="300" cy="280" r="120" fill="none" stroke="url(#blueGlow)" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Shield / badge shape -->
  <path d="M300 160 L380 200 L380 320 Q380 380 300 410 Q220 380 220 320 L220 200 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
  <path d="M300 170 L372 207 L372 316 Q372 372 300 400 Q228 372 228 316 L228 207 Z"
        fill="#0a0a1a" fill-opacity="0.8"/>

  <!-- Gun barrel silhouette (007 style) -->
  <circle cx="300" cy="250" r="35" fill="none" stroke="url(#silverGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="300" cy="250" r="25" fill="none" stroke="url(#silverGrad)" stroke-width="2"/>
  <circle cx="300" cy="250" r="15" fill="none" stroke="url(#silverGrad)" stroke-width="1" opacity="0.6"/>
  <!-- Rifling lines -->
  <line x1="300" y1="215" x2="300" y2="285" stroke="url(#silverGrad)" stroke-width="1" opacity="0.3"/>
  <line x1="265" y1="250" x2="335" y2="250" stroke="url(#silverGrad)" stroke-width="1" opacity="0.3"/>
  <line x1="275" y1="225" x2="325" y2="275" stroke="url(#silverGrad)" stroke-width="1" opacity="0.3"/>
  <line x1="325" y1="225" x2="275" y2="275" stroke="url(#silverGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Center dot (bullet) -->
  <circle cx="300" cy="250" r="5" fill="url(#goldGrad)" filter="url(#strongGlow)"/>

  <!-- "007" text inside shield -->
  <text x="300" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">007</text>

  <!-- "AGENT" text above -->
  <text x="300" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="url(#silverGrad)" letter-spacing="12" filter="url(#glow)">AGENT</text>

  <!-- Tagline -->
  <text x="300" y="530" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00BFFF" letter-spacing="4" opacity="0.8">LOCAL AI OPERATIONS</text>

  <!-- Decorative corner brackets -->
  <!-- Top-left -->
  <path d="M40 60 L40 40 L60 40" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <!-- Top-right -->
  <path d="M540 40 L560 40 L560 60" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-left -->
  <path d="M40 540 L40 560 L60 560" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-right -->
  <path d="M540 560 L560 560 L560 540" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Classification stripe -->
  <rect x="150" y="555" width="300" height="2" fill="url(#goldGrad)" opacity="0.3" rx="1"/>
  <text x="300" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFD700" letter-spacing="6" opacity="0.5">CLASSIFIED</text>
</svg>
