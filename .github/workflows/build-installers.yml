name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      build_windows:
        description: 'Build Windows installer'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS installer'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux packages'
        type: boolean
        default: true
      build_portable:
        description: 'Build portable version'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis dpkg-dev zip

      - name: Install application dependencies
        run: npm install --production

      - name: Set version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build all installers
        run: |
          cd installer
          chmod +x build-all.sh
          
          BUILD_FLAGS="--version ${{ steps.version.outputs.version }}"
          
          if [ "${{ github.event.inputs.build_windows }}" != "false" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --windows"
          fi
          if [ "${{ github.event.inputs.build_macos }}" != "false" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --macos"
          fi
          if [ "${{ github.event.inputs.build_linux }}" != "false" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --linux"
          fi
          if [ "${{ github.event.inputs.build_portable }}" != "false" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --portable"
          fi
          
          # Default to all if manual dispatch without specific flags
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.build_windows }}" ]; then
            BUILD_FLAGS="--all --version ${{ steps.version.outputs.version }}"
          fi
          
          ./build-all.sh $BUILD_FLAGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ -d "dist/portable" ]; then
            cp dist/portable/*.tar.gz artifacts/ 2>/dev/null || true
            cp dist/portable/*.zip artifacts/ 2>/dev/null || true
          fi
          if [ -d "dist/windows" ]; then
            cp dist/windows/*.exe artifacts/ 2>/dev/null || true
            cp dist/windows/*.zip artifacts/ 2>/dev/null || true
          fi
          if [ -d "dist/macos" ]; then
            cp dist/macos/*.zip artifacts/ 2>/dev/null || true
            cp dist/macos/*.dmg artifacts/ 2>/dev/null || true
          fi
          if [ -d "dist/linux" ]; then
            cp dist/linux/*.deb artifacts/ 2>/dev/null || true
            cp dist/linux/*.tar.gz artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: super-goat-royalties-installers-${{ steps.version.outputs.version }}
          path: artifacts/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "Installers are ready for download."

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Build failed!"
          echo "Check the workflow logs for details."
